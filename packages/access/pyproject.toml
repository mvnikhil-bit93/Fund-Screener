[project]
name = "fund-access"
version = "0.1.0"
description = "Authenticated fund queries and web views"
requires-python = ">=3.12,<3.13"
dependencies = ["psycopg[binary,pool]>=3.2,<4"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/access"]
